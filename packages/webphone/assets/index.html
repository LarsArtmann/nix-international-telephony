<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PBX WebPhone</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <span class="brand">☎ WebPhone</span>
        <select id="lang" title="Language / Sprache" aria-label="Language">
          <option value="en">EN</option>
          <option value="de">DE</option>
        </select>
        <span
          id="reg-status"
          class="status status-offline"
          data-i18n-title="regState"
          >offline</span
        >
      </header>

      <section id="login-view" class="card">
        <h1 data-i18n="signin">Sign in to your extension</h1>
        <form id="login-form" autocomplete="off">
          <label>
            <span data-i18n="extension">Extension</span>
            <input
              id="ext"
              name="extension"
              inputmode="numeric"
              placeholder="1000"
              required
            />
          </label>
          <label>
            <span data-i18n="password">Password</span>
            <input
              id="pass"
              name="password"
              type="password"
              placeholder="••••••••"
              required
            />
          </label>
          <label class="remember">
            <input id="remember" type="checkbox" />
            <span data-i18n="remember"
              >remember extension on this device (never the password)</span
            >
          </label>
          <button type="submit" class="primary" data-i18n="connect">
            Connect
          </button>
        </form>
        <p class="hint" id="login-error" hidden></p>
      </section>

      <section id="phone-view" class="card" hidden>
        <div class="whoami">
          <span data-i18n="signedInAs">signed in as</span>
          <strong id="whoami-ext"></strong>
          <button
            id="logout"
            class="ghost small"
            data-i18n="signOut"
            data-i18n-title="signOutTitle"
          >
            sign out
          </button>
        </div>

        <form id="dial-form" autocomplete="off">
          <input
            id="dest"
            inputmode="tel"
            data-i18n-placeholder="dialPlaceholder"
            required
          />
          <button type="submit" class="primary" id="call-btn" data-i18n="call">
            Call
          </button>
        </form>

        <div id="calls"></div>

        <div id="keypad" hidden>
          <button data-tone="1">1</button>
          <button data-tone="2">2<span>ABC</span></button>
          <button data-tone="3">3<span>DEF</span></button>
          <button data-tone="4">4<span>GHI</span></button>
          <button data-tone="5">5<span>JKL</span></button>
          <button data-tone="6">6<span>MNO</span></button>
          <button data-tone="7">7<span>PQRS</span></button>
          <button data-tone="8">8<span>TUV</span></button>
          <button data-tone="9">9<span>WXYZ</span></button>
          <button data-tone="*">✱</button>
          <button data-tone="0">0<span>+</span></button>
          <button data-tone="#">#</button>
        </div>

        <div id="incoming-call" class="incoming" hidden>
          <span
            ><span data-i18n="incoming">Incoming call from</span>
            <strong id="incoming-from"></strong
          ></span>
          <div class="controls">
            <button id="accept-btn" class="primary" data-i18n="accept">
              Accept
            </button>
            <button id="reject-btn" class="danger" data-i18n="reject">
              Reject
            </button>
          </div>
        </div>

        <details class="log-wrap" id="history-wrap" hidden>
          <summary data-i18n="recentCalls">Recent calls</summary>
          <ul id="history-list" class="history"></ul>
        </details>

        <details class="log-wrap">
          <summary data-i18n="eventLog">Event log</summary>
          <ul id="log"></ul>
        </details>
      </section>
    </main>

    <audio id="remote-audio" autoplay></audio>

    <script src="/config.js"></script>
    <script src="/sip.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
