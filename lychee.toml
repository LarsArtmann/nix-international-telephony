# BuildFlow's lychee invocation honors this file (probed 2026-09-16).
# Excluded classes:
# - docs/status/**: point-in-time snapshots (localhost URLs, links to files
#   later archived/renamed) - not living docs to keep green.
# - the fspbx trial research doc: documents a localhost trial VM URL by design.
# - the operator webroot: root-relative links (/favicon.svg, /operator/…) are
#   correct as served by nginx; lychee has no server context (same FP class as
#   the old webphone-asset exclusion).
exclude_path = [
    "docs/status/**",
    "docs/research/2026-09-16_fspbx-trial.md",
    "packages/telephony-operator/webroot/**",
]
