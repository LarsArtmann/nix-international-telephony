# The browser E2E (tests/browser-e2e.py) runs inside the NixOS test VM;
# selenium ships no type stubs, so silence only its missing-import errors.
[mypy]

[mypy-selenium.*]
ignore_missing_imports = True

# tests/vmclient.py imports the SIP helper that the VM image installs at
# /etc/sip.py (tests/common.nix copies tests/sip.py); it only exists
# inside the test VM.
[mypy-sip]
ignore_missing_imports = True

# The check-untyped-defs LADDER (2026-11-07): strictness climbs one
# module at a time — a module joins only when it already passes, so the
# ladder never adds findings, it freezes them out. Extend per module;
# the lock-gate scripts went first (the guards guard themselves).
[mypy-scripts.lock_guard]
check_untyped_defs = True

[mypy-scripts.lock_move_hook]
check_untyped_defs = True

[mypy-scripts.tracked_inputs]
check_untyped_defs = True

[mypy-scripts.lock_doctor]
check_untyped_defs = True
