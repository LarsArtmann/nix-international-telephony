# Non-default BuildFlow policy only (rationale per key; do not restate defaults).
#
# build_mode: local default is fast — the real gate is `nix flake check`
# (CI) and explicit `buildflow --build-mode full --max-time 60m` when a
# full pipeline is wanted; a plain `buildflow` must never die at the
# default 5m hard-kill mid-nix-build again.
build_mode: fast
#
# Whole-tool skips (skip_steps cannot be per-file):
# - pytest-test: this repo's Python files are NixOS test-driver scripts;
#   the real test suites are the VM checks in `nix flake check`, pytest
#   collects 0 items by design.
skip_steps:
  - pytest-test
