name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: nix flake check (eval, packages, VM test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Make KVM accessible for the NixOS VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: nix flake check
        run: nix flake check

  # aarch64 boot proof: standard arm64 hosted runners are free for public
  # repositories (label verified against actions/runner-images) but expose
  # no /dev/kvm (Azure arm VMs have no nested virt), so the suite runs the
  # telephony-webphone-tcg check: the same VM test with the derivation's
  # kvm system-feature requirement dropped, executing under same-arch TCG.
  # The x86-host TCG attempt could never get the harness root disk to settle
  # under layered emulation — same-arch on native hardware can. First run
  # may compile FreeSWITCH for aarch64 if the binary cache misses it.
  check-aarch64:
    name: aarch64 VM test (telephony-webphone, TCG)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # The runner's nix must advertise the nixos-test feature to
          # build the VM-test derivation (no kvm: same-arch TCG run).
          extra-conf: |
            system-features = nixos-test benchmark big-parallel

      - name: Run one VM suite natively on aarch64 (TCG, no KVM on runner)
        run: nix build -L .#checks.aarch64-linux.telephony-webphone-tcg
