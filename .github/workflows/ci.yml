name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: nix flake check (eval, packages, VM test)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Make KVM accessible for the NixOS VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cross-arch eval check, per system (no builds)
        # Catches eval-only breakage on every flake system (e.g. string
        # contexts making foreign-arch drvs invalid) before the aarch64
        # job spends an hour building. One process per system: a single
        # --all-systems process evals ~140 derivations in one heap and
        # degrades from ~0.2s to 7min per check (GC thrash), blowing the
        # job timeout since 2026-10-01 (22 consecutive kills at 60min,
        # 63/70 checks done at the last kill). Raised 20 -> 60 on
        # 2026-10-06: the step itself timed out at 20min in runs
        # 37482412349 and 37528539317 while aarch64 on its own lane is
        # green — the budget, not the tree, was the failure.
        timeout-minutes: 60
        run: |
          nix flake check --no-build
          nix flake check --system aarch64-linux --no-build

      - name: nix flake check
        run: nix flake check

  # The stdlib Python suites (telnyx reconcile engine, messaging bridge,
  # voice/text agents, the native-OIDC surfaces) run on the system python3
  # — no setup-python, no dependencies. Until 2026-10-30 NONE of them ran
  # in CI: an engine regression could land CI-green (proven by the
  # 2026-10-30 train that shipped on a local-suite green while the nix
  # jobs died as infra cancels). Each module is bounded by its own
  # timeout so one hanging e2e suite cannot wedge the job.
  python-tests:
    name: stdlib python suites (engine, bridge, agents, oidc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run every stdlib unittest module (bounded per module)
        run: |
          failed=0
          for module in tests/test_*.py; do
            name="$(basename "$module" .py)"
            echo "::group::$name"
            if ! timeout 300 python3 -m unittest "tests.$name" -v 2>&1; then
              echo "::error::$name failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  # aarch64 boot proof: standard arm64 hosted runners are free for public
  # repositories (label verified against actions/runner-images) but expose
  # no /dev/kvm (Azure arm VMs have no nested virt). The full VM suites
  # cannot make it through the test driver's fixed 10x30s serial-shell
  # connect window under TCG, so this runs the minimal boot suite
  # (telephony-boot-tcg): kernel -> systemd -> freeswitch -> sofia with the
  # kvm system-feature requirement dropped, executing under same-arch TCG.
  # First run may compile FreeSWITCH for aarch64 if the binary cache misses.
  check-aarch64:
    name: aarch64 VM test (telephony-boot, TCG)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # The runner's nix must advertise the nixos-test feature to
          # build the VM-test derivation (no kvm: same-arch TCG run).
          extra-conf: |
            system-features = nixos-test benchmark big-parallel

      - name: Run minimal boot VM suite natively on aarch64 (TCG, no KVM)
        run: nix build -L .#checks.aarch64-linux.telephony-boot-tcg

  # Browser E2E suite (two chromium instances, WebRTC 1000->1001 call):
  # deliberately outside the default gate (adds a ~1-2 GB chromium
  # closure). Runs on demand via workflow_dispatch; promoted to a
  # periodic/push job once its gating is decided.
  browser-e2e:
    name: Browser E2E VM test (on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Make KVM accessible for the NixOS VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run browser E2E suite
        run: nix build -L .#legacyPackages.x86_64-linux.telephony-browser

  # Failure notification (docs/ci-posture.md Option B, the minimum):
  # posts one message per failed run to ALERT_WEBHOOK when the repo
  # secret is set — no-op otherwise, so the workflow stays green-shape
  # for forks and until the owner wires the secret. The alerts.urlFile
  # webhook the host units use cannot live in CI as a file; the owner
  # pastes the same URL once as a repo secret.
  notify-failure:
    name: Failure notification
    needs: [check, check-aarch64]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # secrets are unavailable in `if:` (actionlint-verified) — the
      # empty-secret no-op is decided in the script instead.
      - name: Post the failed-run summary to the alert webhook
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "ALERT_WEBHOOK unset — notification skipped (docs/ci-posture.md Option B)"
            exit 0
          fi
          payload=$(jq -n \
            --arg text "CI FAILED on main: $RUN_URL (run ${{ github.run_id }}, commit ${{ github.sha }})" \
            '{text: $text}')
          curl -sf -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK"
