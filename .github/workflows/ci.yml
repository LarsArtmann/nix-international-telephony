name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: nix flake check (eval, packages, VM test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Make KVM accessible for the NixOS VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: nix flake check
        run: nix flake check

  # aarch64 boot proof: standard arm64 hosted runners are free for public
  # repositories (label verified against actions/runner-images). One VM
  # suite runs natively — the x86-host TCG attempt could never get the
  # harness root disk to settle under layered emulation. First run may
  # compile FreeSWITCH for aarch64 if the binary cache misses it.
  check-aarch64:
    name: aarch64 VM test (telephony-webphone)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Make KVM accessible for the NixOS VM test (when exposed)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm on this runner; QEMU falls back to same-arch TCG"
          fi

      - name: Run one VM suite natively on aarch64
        run: nix build -L .#checks.aarch64-linux.telephony-webphone
