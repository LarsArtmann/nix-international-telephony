# Monthly flake-input refresh: opens a PR with `nix flake update` so the
# cadence is visible and reviewable instead of relying on remembering.
name: flake-update

on:
  schedule:
    - cron: "0 5 1 * *" # 05:00 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake inputs
        run: |
          nix flake update
          nix flake check --all-systems --no-build

      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/flake-update-$(date +%Y-%m)"
          git config user.name "flake-update bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch" || git switch "$branch"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "inputs already up to date"
            exit 0
          fi
          git commit -m "chore: monthly flake input refresh $(date +%Y-%m)"
          git push origin "$branch"
          gh pr create --title "chore: monthly flake input refresh $(date +%Y-%m)" \
            --body "Automated \`nix flake update\` run. The cross-arch eval gate passed; review the diff and let CI validate the rest." \
            --base main --head "$branch" || \
            gh pr edit "$branch" --body "Automated \`nix flake update\` run (updated)."
